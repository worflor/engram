[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woflo-engram"
version = "0.4.0"
description = "Complex oscillator trajectory codec and statistical memory wells"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Whisper-Protocol-1.0 AND LicenseRef-WLCSL-1.0"
license-files = ["LICENSE.md", "LICENSES/Whisper-Protocol-1.0.md", "LICENSES/README.md"]
authors = [{name = "Woflo Labs"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
jit = ["numba>=0.60"]
gpu = ["wgpu>=0.31,<0.32"]

[project.urls]
Repository = "https://github.com/worflor/engram"

[tool.setuptools]
py-modules = ["engram_codec", "engram_wire", "engram_analysis", "engram_memory_io", "engram_embeddings", "engram_network", "engram_training", "engram_retrieval", "engram_metrics", "engram_acceleration", "engram_corpus", "engram_npc", "engram_affine", "engram_history", "engram_stability", "engram_relations"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["engram_kernels"]

[tool.setuptools.package-data]
engram_kernels = ["*.wgsl"]
